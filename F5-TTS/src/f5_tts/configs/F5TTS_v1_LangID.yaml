hydra:
  run:
    dir: exps/${model.name}_${model.mel_spec.mel_spec_type}_${model.tokenizer}_${datasets.name}/${now:%Y-%m-%d}_${now:%H-%M-%S}

# Language-ID conditioning experiment (XTTS-style): a per-language embedding is added to
# the DiT's global AdaLN conditioning vector. Enabled purely by model.arch.num_langs below.
# Requires the dataset rows to carry an integer "lang_label" (see lang_mapping.json note in
# the training memo) so collate_fn can emit the per-sample "lang" tensor.

# NOTE: datasets/optim below are single-GPU Eddie values borrowed from the accent LoRA recipe,
# NOT the upstream 8-GPU Emilia defaults. Re-tune epochs/warmup to your corpus size before a run.
datasets:
  name: Emilia_ZH_EN  # dataset name  (override on CLI with your multilingual set)
  batch_size_per_gpu: 9600  # frames/gpu; single-GPU default (upstream used 38400 for 8 GPUs -> OOMs 1 GPU)
  batch_size_type: frame  # frame | sample
  max_samples: 64  # max sequences per batch if use frame-wise batch_size
  num_workers: 8  # persistent_workers=True: each forks & holds VIRT for the whole run -> keep low under SGE h_vmem

optim:
  epochs: 11  # TODO: Emilia-scale placeholder; set for your multilingual corpus
  learning_rate: 7.5e-5  # base-pretraining LR; a full-FT lang run may want lower
  num_warmup_updates: 20000  # assumes a long run; lower for a short finetune
  grad_accumulation_steps: 1  # note: updates = steps / grad_accumulation_steps
  max_grad_norm: 1.0  # gradient clipping
  bnb_optimizer: False  # use bnb 8bit AdamW optimizer or not

model:
  name: F5TTS_v1_LangID  # model name
  tokenizer: pinyin  # tokenizer type
  tokenizer_path: null  # if 'custom' tokenizer, define the path want to use (should be vocab.txt)
  tokenized: False  # whether the dataset is already tokenized
  backbone: DiT
  arch:
    dim: 1024
    depth: 22
    heads: 16
    ff_mult: 2
    text_dim: 512
    text_mask_padding: True
    qk_norm: null  # null | rms_norm
    conv_layers: 4
    pe_attn_head: null
    attn_backend: torch  # torch | flash_attn
    attn_mask_enabled: False
    checkpoint_activations: False  # recompute activations and save memory for extra compute
    num_langs: 4  # <-- number of languages; enables language-ID conditioning. Set to your count.
  mel_spec:
    target_sample_rate: 24000
    n_mel_channels: 100
    hop_length: 256
    win_length: 1024
    n_fft: 1024
    mel_spec_type: vocos  # vocos | bigvgan
  vocoder:
    is_local: False  # use local offline ckpt or not
    local_path: null  # local vocoder path

ckpts:
  logger: wandb  # wandb | tensorboard | null
  wandb_project: F5TTS_langid # wandb project name
  wandb_run_name: ${model.name}_${model.mel_spec.mel_spec_type}_${model.tokenizer}_${datasets.name}  # wandb run name
  log_samples: True  # infer random sample per save checkpoint
  save_per_updates: 10000  # save samples and checkpoint per updates
  keep_last_n_checkpoints: -1  # -1 to keep all, 0 to not save intermediate, > 0 to keep last N checkpoints
  last_per_updates: 5000  # save last checkpoint per updates
  save_dir: ${hydra:run.dir} # checkpoint save dir
